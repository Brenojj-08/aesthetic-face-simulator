<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aesthetic Face Simulator</title>
</head>
<body>
  <main>
    <h1>Aesthetic Face Simulator</h1>

    <p>
      An educational visual simulator for facial aesthetics concepts.
    </p>

    <hr>

    <h2>Choose an area</h2>

    <button>Forehead</button>
    <button>Glabella</button>
    <button>Eye Area</button>

    <h2>Simulation intensity</h2>

    <label for="intensity">Natural ↔ Smooth</label>
    <br>
    <input id="intensity" type="range" min="0" max="100" value="0">

    <p>
      <strong>Educational simulation only.</strong>
      This project does not provide medical advice, treatment recommendations,
      injection guidance, or guaranteed clinical outcomes.
    </p>
  </main>
</body>
</html>
